# IamOrgAdmin-Swedenconnect login theme.
#
# Extends the stock keycloak.v2 login theme. Only what differs is overridden here:
#   login.ftl                      identity providers first, username/password behind a toggle button
#   resources/css/swedenconnect.css  colours, typeface and logo taken from https://sandbox.swedenconnect.se/home/
#   messages/                      the label of the toggle button
parent=keycloak.v2

# The sandbox site has no dark variant, so the theme does not follow the browser's colour scheme.
darkMode=false

# css/styles.css is inherited from the parent theme and must stay first.
styles=css/styles.css css/swedenconnect.css
