# Publishes the release artifacts of a given tag to Maven Central.
#
# Releases are published to GitHub Packages by maven-github-deploy.yml. This workflow is kept in
# case publishing to Maven Central is needed again, and can only be started by hand, with the tag
# to publish as input. It checks out that tag and deploys with the "release" and
# "maven-central-release" profiles of the parent POM, where the second one replaces the deploy to
# GitHub Packages with the Central publishing plugin. Every module of the build is published, except
# the demo and admin application modules, which set the skipPublishing property in demo/pom.xml and
# iam-admin-app/pom.xml.
#
# Maven Central does not allow a published version to be removed or replaced, so the tag and the
# version in the POMs are checked before anything is built. If that check fails nothing is published.
name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to publish, for example v1.0.1'
        required: true
        type: string

# Narrowed to what the build requires. Every dependency comes from Maven Central or the Shibboleth
# repository, so nothing more than reading the repository is needed.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag }}

    steps:
      # The ref is given in full, so a branch of the same name as the tag is never checked out.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # setup-java writes a settings.xml holding the github server alone. Publishing to Maven Central
      # needs the central server, so the file is replaced here. The values are environment
      # references, so no secret is written to the file or shown in the log.
      - name: Configure the Maven servers
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_TOKEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      # Nothing has been built at this point, so a tag that does not match publishes nothing.
      - name: Check that the tag matches the Maven version of every published module
        run: ./internal/scripts/check-release-version.sh "${TAG}"

      # A full build and then the deploy, as in maven-github-deploy.yml, but with the
      # maven-central-release profile added. The tests are not run, since internal/scripts/release.sh
      # has run them before the tag was pushed. Signing uses the Bouncy Castle signer of the Maven GPG
      # plugin, which takes the key and its passphrase from the environment.
      - name: Build and deploy to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.BOT_GPG_PASSWORD }}
        run: mvn -Prelease,maven-central-release clean deploy -DskipTests -Dgpg.signer=bc --no-transfer-progress
