# Publishes the release artifacts to Maven Central when a version tag is pushed.
#
# It runs alongside the Docker release and GitHub release workflows, which react to the same tags,
# and does not depend on them. The deploy uses the "release" profile of the parent POM, the same one
# used for a deploy from a developer machine. Every module of the build is published, except the
# demo modules, which set the skipPublishing property in demo/pom.xml.
#
# Maven Central does not allow a published version to be removed or replaced, so the tag and the
# version in the POMs are checked before anything is built. If that check fails nothing is published.
name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

# Narrowed to what the build requires. Every dependency comes from Maven Central or the Shibboleth
# repository, so nothing more than reading the repository is needed.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # setup-java writes a settings.xml holding the github server alone, which this build does not
      # use. Publishing needs the central server, so the file is replaced here. The values are
      # environment references, so no secret is written to the file or shown in the log.
      - name: Configure the Maven servers
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_TOKEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      # Nothing has been built at this point, so a tag that does not match publishes nothing.
      - name: Check that the tag matches the Maven version of every published module
        env:
          TAG: ${{ github.ref_name }}
        run: ./internal/scripts/check-release-version.sh "${TAG}"

      # A full build and then the deploy. The tests are not run, since internal/scripts/release.sh has
      # run them, with the same release profile, before the tag was pushed. They are still compiled,
      # and the test source files are still attached, so what is published is unchanged. Signing uses
      # the Bouncy Castle signer of the Maven GPG plugin, which takes the key and its passphrase from
      # the environment, so the runner needs no gpg executable and no key import. Selecting it on the
      # command line leaves the release profile usable as it is from a developer machine.
      - name: Build and deploy to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.BOT_GPG_PASSWORD }}
        run: mvn -Prelease clean deploy -DskipTests -Dgpg.signer=bc --no-transfer-progress
